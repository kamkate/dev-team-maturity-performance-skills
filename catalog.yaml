    - EPIC_SPRAWL_RISK
    - SOLO_TASK_RISK
    context: Unplanned work, bugs, or local optimizations may be consuming too much sprint capacity.
    hypothesis: A minimum roadmap-capacity guardrail should protect strategic execution while still allowing necessary operational work.
    intervention: Set a target range for roadmap-linked sprint work and review exceptions during planning.
    mechanism: A visible capacity guardrail prevents roadmap work from being crowded out by reactive demand.
    kpi_impact_map: RC ↑ → ECT ↓; RC ↑ → EWIP ↓
    feedback_loop: Reduces roadmap drift and increases concentration on priority epics.
    expected_outcome: Higher roadmap contribution and stronger alignment between sprint execution and strategic objectives.
    secondary_effects: Operational work may need explicit prioritization rather than informal insertion.
    preconditions: Roadmap-linked work must be classified consistently using roadmap_depth.
    risks: A fixed percentage target may be harmful during incidents or major production instability.
