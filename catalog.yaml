    recommendation_name: Run Story Slicing Workshop
    catalog_status: active
    applicable_pattern_ids:
    - LONG_CYCLE_TIME
    - LOW_SPRINT_COMPLETION
    context: Stories may be too large or insufficiently prepared to complete reliably within a sprint.
    hypothesis: Improving story slicing should reduce story cycle time and improve sprint completion.
    intervention: Run a story slicing workshop focused on breaking upcoming work into smaller, testable, independently valuable slices.
    mechanism: Smaller stories reduce delivery batch size and increase the chance of completion inside the sprint boundary.
    kpi_impact_map: SCT ↓ → SC ↑; SCT ↓ → ECT ↓
    feedback_loop: Helps reverse the Delivery Stall caused by long story cycle time.
    expected_outcome: Shorter median development cycle time and higher completion reliability.
    secondary_effects: More refinement time may be needed before sprint planning.
    preconditions: Upcoming backlog items must be available for refinement.
    risks: Over-slicing may create artificial tasks that do not deliver meaningful value.
    effort: medium
