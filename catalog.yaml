  "12":
    recommendation_id: INT-012
    recommendation_name: Focus on One Primary Epic per Team
    catalog_status: active
    applicable_pattern_ids:
    - HIGH_EPIC_WIP
    - WIP_DEATH_SPIRAL
    applicable_leading_risk_ids:
    - EPIC_SPRAWL_RISK
    context: The team may be spreading effort across too many active initiatives at the same time.
    hypothesis: Selecting one primary execution focus should reduce context switching and improve throughput on the most important epic.
    intervention: For the next sprint, select one primary epic focus and limit secondary epic work to explicitly justified exceptions.
    mechanism: Sharper focus concentrates team capacity and reduces coordination overhead.
    kpi_impact_map: EWIP ↓ → SCT ↓ → SC ↑; EWIP ↓ → ECT ↓
    feedback_loop: Supports the Virtuous Cycle by reducing WIP first.
    expected_outcome: Faster progress on priority epic work and lower story cycle time.
    secondary_effects: Non-primary epic work may slow temporarily.
    preconditions: Leadership must agree which epic has highest priority.
    risks: If priority changes frequently, the intervention may create confusion instead of focus.
    effort: low
    impact: high
    acceptability: medium
    feasibility: high
