  "8":
    recommendation_id: INT-008
    recommendation_name: Run Blocker Aging Review
    catalog_status: active
    applicable_pattern_ids:
    - LONG_CYCLE_TIME
    - LONG_EPIC_DEVELOPMENT_TIME
    applicable_leading_risk_ids:
    - LONG_BLOCKED_TASKS
    - STALLED_WIP
    context: Long cycle time may be caused by unresolved blockers, dependency waiting, or slow decisions.
    hypothesis: A recurring blocker aging review should reduce waiting time and prevent blocked items from silently aging.
    intervention: Review all active items older than the team’s cycle-time threshold and assign an explicit unblock owner and next action.
    mechanism: Aging review makes hidden waiting visible and creates ownership for removing blockers.
    kpi_impact_map: SCT ↓ → SC ↑; SCT ↓ → ECT ↓
    feedback_loop: Interrupts the Delivery Stall by reducing time spent in blocked or unclear states.
    expected_outcome: Lower median cycle time and fewer old unfinished items.
    secondary_effects: Managers may need to escalate cross-team dependencies.
    preconditions: The team must be able to identify aging items from Jira data.
    risks: If blockers require external teams, local review alone may not resolve the issue.
    effort: low
    impact: medium
    acceptability: high
    feasibility: high
    confidence_level: medium
    evidence_source_ids:
    - cycle_time_p50
    - epic_dev_time
    evidence_type: mixed
    owner_role: Engineering Manager
