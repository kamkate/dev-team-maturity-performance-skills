recommendation_catalog:
  "1":
    recommendation_id: INT-001
    recommendation_name: Enforce WIP Limits
    catalog_status: active
    applicable_pattern_ids:
    - HIGH_EPIC_WIP
    - LONG_CYCLE_TIME
    - WIP_DEATH_SPIRAL
    applicable_leading_risk_ids:
    - EPIC_SPRAWL_RISK
    context: The team may be carrying too many active epics in parallel, which increases context switching and slows delivery flow.
    hypothesis: Reducing active epic WIP should reduce multitasking, lower cycle time, and improve sprint predictability.
    intervention: Set an explicit team-level WIP limit for active epics and review it during sprint planning and weekly delivery checkpoints.
    mechanism: Lower WIP reduces context switching and allows the team to finish active work before starting new work.
    kpi_impact_map: EWIP ↓ → SCT ↓ → SC ↑ → ECT ↓ → RC ↑
    feedback_loop: "Breaks the WIP Death Spiral: EWIP ↑ → SCT ↑ → ECT ↑ → EWIP ↑."
    expected_outcome: Lower active epic count, shorter story cycle time, and more predictable sprint completion.
    secondary_effects: Some lower-priority initiatives may wait longer before entering execution.
    preconditions: Leadership must agree which epics are truly active and which should be paused.
    risks: If urgent exceptions are unmanaged, the WIP limit may be bypassed and lose credibility.
    effort: low
    impact: high
    acceptability: medium
    feasibility: high
    confidence_level: high
    evidence_source_ids:
    - parallel_epics
    - cycle_time_p50
    evidence_type: mixed
    owner_role: Engineering Manager
    review_cycle: 2 sprints
    schema_version: v1
    definition_version: recommendation_catalog_v1
    created_at: 2026-05-22T00:00:00+02:00
    updated_at: 2026-08-15T00:00:00+02:00

  "2":
    recommendation_id: INT-002
    recommendation_name: Split Large Epics
    catalog_status: active
    applicable_pattern_ids:
    - HIGH_EPIC_WIP
    - LONG_CYCLE_TIME
    - LONG_EPIC_DEVELOPMENT_TIME
    context: Long-running epics may hide excessive scope, unclear boundaries, or dependency complexity.
    hypothesis: Splitting large epics into smaller delivery slices should reduce epic cycle time and create earlier progress signals.
    intervention: Run an epic slicing review and split oversized epics into smaller independently reviewable delivery units.
    mechanism: Smaller epics reduce coordination load, make progress visible earlier, and reduce the probability of long-running work.
    kpi_impact_map: ECT ↓ → EWIP ↓; SCT ↓ → SC ↑
    feedback_loop: Reduces epic accumulation by increasing closure rate of active epics.
    expected_outcome: Shorter epic development time, improved flow visibility, and more reliable sprint planning.
    secondary_effects: Backlog structure may become more detailed and require stronger refinement discipline.
    preconditions: Product and engineering leads must be available to redefine epic boundaries.
    risks: Superficial splitting may create tracking overhead without reducing actual dependency complexity.
    effort: medium
    impact: high
    acceptability: medium
    feasibility: medium
    confidence_level: high
    evidence_source_ids:
    - cycle_time_p50
    - epic_dev_time
    evidence_type: mixed
    owner_role: Product Manager
    review_cycle: 2 sprints
    schema_version: v1
    definition_version: recommendation_catalog_v1
    created_at: 2026-05-22T00:00:00+02:00
    updated_at: 2026-05-22T00:00:00+02:00

  "3":
    recommendation_id: INT-003
    recommendation_name: Improve Sprint Planning Discipline
    catalog_status: active
    applicable_pattern_ids:
    - LONG_CYCLE_TIME
    - LOW_SPRINT_COMPLETION
    applicable_leading_risk_ids:
    - CARRYOVER_RISK
    context: Sprint scope may not match the team’s demonstrated delivery capacity.
    hypothesis: Planning from recent observed capacity should improve sprint completion without increasing team pressure.
    intervention: Use recent sprint completion, carry-over, and cycle-time evidence to set a conservative sprint commitment.
    mechanism: Capacity-based planning reduces overcommitment and improves the probability that planned work finishes inside the sprint.
    kpi_impact_map: SC ↑ → ECT ↓; SC ↑ → RC ↑
    feedback_loop: Helps stop the Delivery Stall by restoring sprint-level predictability.
    expected_outcome: More realistic sprint commitments and fewer incomplete items carried into the next sprint.
    secondary_effects: The team may initially commit to less work while recalibrating its baseline.
    preconditions: Recent sprint history must be available and reviewed during planning.
    risks: If stakeholders continue to inject work mid-sprint, planning discipline will not improve outcomes.
    effort: low
    impact: medium
    acceptability: high
    feasibility: high
    confidence_level: high
    evidence_source_ids:
    - sprint_completion
    evidence_type: quantitative
    owner_role: Scrum Master
    review_cycle: 2 sprints
    schema_version: v1
    definition_version: recommendation_catalog_v1
    created_at: 2026-05-22T00:00:00+02:00
    updated_at: 2026-08-15T00:00:00+02:00

  "4":
    recommendation_id: INT-004
    recommendation_name: Increase Roadmap Alignment
    catalog_status: active
    applicable_pattern_ids:
    - LOW_ROADMAP_CONTRIBUTION
    - ROADMAP_DRIFT
    applicable_leading_risk_ids:
    - INITIATIVE_LINK_RISK
    - SOLO_TASK_RISK
    context: Sprint work may not sufficiently contribute to roadmap-level objectives.
    hypothesis: Making roadmap linkage explicit before sprint commitment should increase the share of work connected to strategic priorities.
    intervention: Review sprint candidates against roadmap goals and require explicit roadmap classification before finalizing sprint scope.
    mechanism: Explicit alignment checks reduce drift toward unplanned or locally optimized work.
    kpi_impact_map: RC ↑ → ECT ↓; RC ↑ → EWIP ↓; RC ↑ → SC ↑
    feedback_loop: Supports a positive delivery cycle by concentrating capacity on fewer roadmap-relevant epics.
    expected_outcome: Higher roadmap contribution and clearer leadership visibility into strategic delivery.
    secondary_effects: Some local improvement work may be delayed if roadmap contribution is prioritized.
    preconditions: Roadmap priorities must be available in a form usable during sprint planning.
    risks: If roadmap labels are vague, teams may tag work inconsistently.
    effort: medium
    impact: medium
    acceptability: medium
    feasibility: high
    confidence_level: medium
    evidence_source_ids:
    - roadmap_contribution
    evidence_type: quantitative
    owner_role: Engineering Manager
    review_cycle: 2 sprints
    schema_version: v1
    definition_version: recommendation_catalog_v1
    created_at: 2026-05-22T00:00:00+02:00
    updated_at: 2026-08-15T00:00:00+02:00

  "5":
    recommendation_id: INT-005
    recommendation_name: Introduce Intake Control
    catalog_status: active
    applicable_pattern_ids:
    - HIGH_EPIC_WIP
    - ROADMAP_DRIFT
    context: New work may be entering execution faster than the team can finish existing work.
    hypothesis: Controlling intake should prevent uncontrolled WIP growth and protect roadmap execution capacity.
    intervention: "Create a lightweight intake rule: no new epic enters active execution unless an existing active epic is closed, paused, or explicitly escalated."
    mechanism: Intake control stabilizes the system by limiting the inflow of parallel work.
    kpi_impact_map: EWIP ↓ → SCT ↓; EWIP ↓ → ECT ↓; EWIP ↓ → RC ↑
    feedback_loop: Prevents re-entry into the WIP Death Spiral after WIP limits are introduced.
    expected_outcome: More stable active portfolio and reduced context switching.
    secondary_effects: Stakeholders may need to negotiate priorities more explicitly.
    preconditions: Active epic status must be visible and trusted.
    risks: Without leadership support, intake control may be perceived as bureaucracy.
    effort: medium
    impact: high
    acceptability: medium
    feasibility: medium
    confidence_level: high
    evidence_source_ids:
    - parallel_epics
    - roadmap_contribution
    evidence_type: mixed
    owner_role: VP Engineering
    review_cycle: 2 sprints
