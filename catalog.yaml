    context: Epics may remain open after meaningful delivery has stopped or after scope has become stale.
    hypothesis: Reviewing open epics should reduce artificial WIP and improve portfolio visibility.
    intervention: Review all active epics older than the epic development-time threshold and decide whether to close, split, pause, or re-scope them.
    mechanism: Epic closure review removes stale WIP and forces explicit decisions about long-running work.
    kpi_impact_map: ECT ↓ → EWIP ↓; EWIP ↓ → SCT ↓
    feedback_loop: Reduces epic accumulation and prevents old work from inflating WIP.
    expected_outcome: Cleaner active epic portfolio and lower average epic development time.
    secondary_effects: Some epics may need product-level redefinition.
    preconditions: Epic ownership and current business relevance must be clear.
    risks: Closing epics administratively without resolving real scope may distort reporting.
