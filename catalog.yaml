    recommendation_name: Create Roadmap Capacity Guardrail
    catalog_status: active
    applicable_pattern_ids:
    - HIGH_EPIC_WIP
    - LOW_ROADMAP_CONTRIBUTION
    - ROADMAP_DRIFT
    applicable_leading_risk_ids:
