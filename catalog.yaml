  "7":
    recommendation_id: INT-007
    recommendation_name: Clarify Definition of Ready
    catalog_status: active
    applicable_pattern_ids:
    - LONG_CYCLE_TIME
    - LOW_SPRINT_COMPLETION
    applicable_leading_risk_ids:
    - PLANNING_READINESS_RISK
    context: Work may enter sprint execution before requirements, dependencies, or acceptance criteria are sufficiently clear.
    hypothesis: A clearer Definition of Ready should reduce blocked time and improve flow efficiency.
    intervention: "Define minimum readiness criteria for work entering sprint execution: clear outcome, owner, acceptance criteria, dependency status, and expected size."
    mechanism: Better readiness reduces waiting, rework, and clarification loops during development.
    kpi_impact_map: SCT ↓ → SC ↑
    feedback_loop: Reduces one of the drivers of story cycle-time degradation.
    expected_outcome: Fewer blocked stories and shorter cycle time.
    secondary_effects: Some items may be delayed until they are ready enough to start.
    preconditions: Team and product owner must agree on readiness criteria.
    risks: If applied too rigidly, the rule may slow urgent work unnecessarily.
    effort: low
    impact: medium
    acceptability: high
    feasibility: high
    confidence_level: medium
    evidence_source_ids:
    - cycle_time_p50
    - sprint_completion
    evidence_type: qualitative
    owner_role: Scrum Master
    review_cycle: 2 sprints
    schema_version: v1
    definition_version: recommendation_catalog_v1
