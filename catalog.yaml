  "13":
    recommendation_id: INT-013
    recommendation_name: Establish Bug Intake Triage
    catalog_status: active
    applicable_pattern_ids: []
    applicable_leading_risk_ids:
    - BUG_INJECTION_RISK
    - BUG_FEATURE_RISK
    context: Bugs may enter sprint execution without a shared severity/priority discipline, silently displacing planned roadmap and feature work beyond what was committed at planning.
    hypothesis: A lightweight triage gate for incoming bugs should reduce uncontrolled mid-sprint bug injection and stabilize the bug-to-feature ratio without blocking genuinely urgent fixes.
    intervention: Introduce a bug-triage checkpoint — any bug proposed for mid-sprint entry is classified against an agreed severity scale (blocker / critical / non-critical); only blocker/critical bugs enter the current sprint, others queue for the next planning cycle.
    mechanism: Explicit severity triage separates genuinely urgent defects from routine bug backlog, preventing unmanaged bug volume from silently consuming sprint and roadmap capacity.
    kpi_impact_map: bug volume ↓ → SC ↑; bug volume ↓ → RC ↑
    feedback_loop: Prevents bug backlog from becoming a second, uncontrolled intake channel alongside planned scope — complements INT-011's mid-sprint scope-change rule, specific to defects rather than any addition.
    expected_outcome: Lower uncontrolled bug injection rate, more stable bug-to-feature ratio, protected sprint completion and roadmap contribution.
    secondary_effects: Non-critical bugs may sit longer in the backlog; requires an agreed escalation path for urgent items misclassified as non-critical.
    preconditions: Team has an agreed bug severity/priority scheme; someone (tech lead / EM / PO) is empowered to make the triage call in real time.
    risks: If the triage gate is bypassed under pressure, it loses credibility quickly — same risk pattern as INT-001's WIP limit.
    effort: low
    impact: medium
    acceptability: medium
    feasibility: high
    confidence_level: medium
    evidence_source_ids:
    - mid_sprint_bug_injection_rate
    - bug_to_feature_ratio
    evidence_type: mixed
    owner_role: Engineering Manager
    review_cycle: 2 sprints
    schema_version: v1
    definition_version: recommendation_catalog_v1
    created_at: 2026-08-15T00:00:00+02:00
    updated_at: 2026-08-15T00:00:00+02:00

  "14":
    recommendation_id: INT-014
    recommendation_name: Strengthen Definition of Done
    catalog_status: active
    applicable_pattern_ids: []
    applicable_leading_risk_ids:
    - REOPEN_RISK
    context: Tasks may be marked complete before verification (testing, review, acceptance) is genuinely finished, causing them to be reopened later once the gap surfaces.
    hypothesis: A clearer, checklist-based Definition of Done should reduce the rate at which completed work is later reopened, and make Sprint Completion a more trustworthy signal.
    intervention: Define explicit Definition of Done criteria (tested, peer-reviewed, acceptance criteria verified) required before a task can transition to Done; use a lightweight completion checklist at the point of closing each task.
    mechanism: Clear, checked completion criteria prevent premature Done status, reducing the rate at which finished work is later found incomplete and must reopen.
    kpi_impact_map: reopen rate ↓ → SC ↑; reopen rate ↓ → SCT ↓
    feedback_loop: Complements INT-007 (Definition of Ready) — DoR governs entry into execution, this governs exit; together they bound the sprint's work at both ends.
    expected_outcome: Lower reopen rate, more reliable Sprint Completion figure, less rework-driven cycle time inflation.
    secondary_effects: Initial adoption may slightly slow the pace of marking items Done while the team adjusts to the checklist.
    preconditions: Team and Product Owner agree on concrete DoD criteria; minimal test/review capacity exists to apply them consistently.
    risks: An overly strict or bureaucratic DoD applied rigidly under time pressure can be bypassed or resented — same tension flagged in INT-007's own risk field for Definition of Ready.
    effort: low
    impact: medium
    acceptability: medium
    feasibility: high
    confidence_level: medium
    evidence_source_ids:
    - reopened_tasks_ratio
    evidence_type: mixed
    owner_role: Scrum Master
    review_cycle: 2 sprints
    schema_version: v1
    definition_version: recommendation_catalog_v1
    created_at: 2026-08-15T00:00:00+02:00
    updated_at: 2026-08-15T00:00:00+02:00
